title: "Linkfl Blog - Crie seu Site Profissional"
email: atendimento@linkfl.com.br
description: "Aprenda como criar um site profissional, atrair clientes pelo Google e aumentar suas vendas com o Linkfl."
baseurl: ""
url: "https://blog.linkfl.com.br"
locale: "pt_BR"
author:
  name: "Linkfl"
logo: "/assets/img/logo-text-LinkFL-cinza-128.svg"
twitter_username: linkfl
github_username: linkfl
twitter:
  username: linkfl
  card: summary_large_image

permalink: /:title/

theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from

sass:
  quiet_deps: true

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - scripts/
  - favicon.ico

# Permalinks
permalink: /:title/
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      permalink: "/:title/"
      image: /assets/img/og-default.png
  - scope:
      path: ""
      type: "paginas"
    values:
      image: /assets/img/og-default.png

# Collections
collections:
  paginas:
    output: true
    permalink: /:path/
